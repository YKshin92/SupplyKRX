name: Daily pension and foreign data
on:
  schedule:
    - cron: '17 9,11 * * 1-5'
  workflow_dispatch:
    inputs:
      start:
        description: 'Optional recovery start date YYYY-MM-DD'
        type: string
      end:
        description: 'Optional end date YYYY-MM-DD; defaults to today in Seoul'
        type: string
permissions:
  contents: read
concurrency:
  group: private-market-data
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private && vars.COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: state
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v4
        with:
          repository: YKshin92/SupplyKRX
          ref: main
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - name: Test data calculations
        working-directory: app
        run: python -m unittest discover -s tests -v
      - name: Collect all common stocks for both investors
        working-directory: app
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
        run: |
          args=(collect --root "$GITHUB_WORKSPACE/state" --end "${END_DATE:-$(TZ=Asia/Seoul date +%F)}")
          if [ -n "$START_DATE" ]; then args+=(--start "$START_DATE"); fi
          python -m collector.cli "${args[@]}"
      - name: Verify web data generation without public deployment
        run: python app/scripts/prepare-local.py --root "$GITHUB_WORKSPACE/state" --target "$RUNNER_TEMP/verified-data"
      - name: Persist only in this private repository
        working-directory: state
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh pension and foreign flows [skip ci]'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
